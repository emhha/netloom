name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repository, unit tests, vet and build
        run: make check
      - name: Race tests
        run: make race
      - name: Compile integration tests
        run: make integration-compile
      - name: Local integration tests (external Cookie services excluded)
        run: make integration-local
